<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark MC</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Sparkmc2/config.js?v=9"></script>
  <style>
    /* Профиль */
    .profile-card {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }
    .profile-banner {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #1b1b22 0%, #111115 100%);
      background-size: cover;
      background-position: center;
    }
    .profile-body {
      padding: 0 28px 28px;
    }
    .profile-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-top: -44px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .profile-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      background: #1d1d24;
      object-fit: cover;
    }
    .profile-actions {
      display: flex;
      gap: 8px;
    }
    .profile-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(251, 191, 36, 0.14);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .profile-bio {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      white-space: pre-wrap;
    }

    /* Настройки и формы */
    .form-card {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    /* Новости */
    .news-list {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-item h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .news-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .news-content {
      font-size: 15px;
      line-height: 1.65;
      color: #d4d4dc;
      white-space: pre-wrap;
    }
    .news-img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 14px;
      border: 1px solid var(--border);
    }

    /* Админ-панель */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .admin-grid { grid-template-columns: 1fr; }
    }
    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0e0e12;
      margin-bottom: 10px;
    }
    .user-row-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .user-row-info img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .user-row-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      display: block;
    }
    .user-row-name:hover { text-decoration: underline; }
    .user-row-bio {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }
    .modal-backdrop.open { display: flex; }
  </style>
</head>
<body>
  <main class="page-main" id="app-root">
    <div style="text-align:center; color: var(--muted);">Загрузка...</div>
  </main>

  <script>
    (async () => {
      await initAuth();
      renderLayoutShell();

      const root = document.getElementById("app-root");
      let rel = window.location.pathname;
      if (rel.startsWith(BASE_PATH)) {
        rel = rel.slice(BASE_PATH.length);
      }
      rel = rel.replace(/^\/|\/$/g, "").replace(/\.html$/, "");

      if (rel === "updates" || rel === "upd") {
        await renderUpdatesPage(root);
      } else if (rel === "settings") {
        await renderSettingsPage(root);
      } else if (rel === "admin") {
        await renderAdminPage(root);
      } else if (rel) {
        await renderProfilePage(root, rel.toLowerCase());
      } else {
        window.location.replace(appUrl(""));
      }
    })();

    // ==========================================
    // СТРАНИЦА НОВОСТЕЙ (/updates)
    // ==========================================
    async function renderUpdatesPage(root) {
      document.title = "Spark MC — Новости";
      let posts = [];
      if (sb) {
        const { data } = await sb
          .from("news")
          .select("*")
          .order("created_at", { ascending: false });
        posts = data || [];
      }

      const adminBtn = isCurrentUserAdmin()
        ? `<a href="${appUrl("admin")}" class="btn btn-primary" data-nav>+ Опубликовать новость</a>`
        : "";

      if (!posts.length) {
        root.innerHTML = `
          <div class="news-list">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
              <div>
                <h1 style="font-size:28px; margin-bottom:4px;">Новости Spark MC</h1>
                <p style="color:var(--muted); font-size:14px;">Актуальные обновления и анонсы разработки.</p>
              </div>
              ${adminBtn}
            </div>
            <div class="card">
              <h3>Проект в активной разработке</h3>
              <div class="news-meta">Создается @melvkin_</div>
              <div class="news-content">Следите за обновлениями — скоро здесь появятся первые подробности о мире и запуске Spark MC.</div>
            </div>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="news-list">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div>
              <h1 style="font-size:28px; margin-bottom:4px;">Новости Spark MC</h1>
              <p style="color:var(--muted); font-size:14px;">Актуальные обновления и анонсы разработки.</p>
            </div>
            ${adminBtn}
          </div>
          ${posts.map(p => {
            const dateStr = new Date(p.created_at).toLocaleDateString("ru-RU", {
              day: "numeric", month: "long", year: "numeric"
            });
            const imgHtml = p.image_url ? `<img class="news-img" src="${escapeHtml(p.image_url)}" alt="">` : "";
            return `
              <article class="card news-item">
                <h3>${escapeHtml(p.title)}</h3>
                <div class="news-meta">${dateStr} · ${escapeHtml(p.author || ADMIN_USERNAME)}</div>
                <div class="news-content">${escapeHtml(p.content)}</div>
                ${imgHtml}
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    // ==========================================
    // НАСТРОЙКИ СВОЕГО ПРОФИЛЯ (/settings)
    // ==========================================
    async function renderSettingsPage(root) {
      document.title = "Spark MC — Настройки профиля";
      if (!currentProfile) {
        root.innerHTML = `
          <div class="card form-card" style="text-align:center;">
            <h2 style="margin-bottom:10px;">Требуется авторизация</h2>
            <p style="color:var(--muted); margin-bottom:20px;">Войдите через Discord, чтобы настроить свой профиль.</p>
            <button class="btn btn-primary" onclick="loginWithDiscord(this)">Войти через Discord</button>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="card form-card">
          <h2 style="margin-bottom:6px;">Настройки профиля</h2>
          <p style="color:var(--muted); font-size:14px; margin-bottom:22px;">
            Ваша ссылка: <a href="${appUrl(currentProfile.username)}" style="color:var(--text);" data-nav>${window.location.origin}${appUrl(currentProfile.username)}</a>
          </p>

          <div class="form-group">
            <label class="form-label">Никнейм (фиксированный)</label>
            <input class="input" type="text" value="${escapeHtml(currentProfile.username)}" disabled>
          </div>

          <div class="form-group">
            <label class="form-label">Новая аватарка (картинка)</label>
            <input class="input" type="file" id="set-avatar" accept="image/*">
          </div>

          <div class="form-group">
            <label class="form-label">Новый баннер (картинка)</label>
            <input class="input" type="file" id="set-banner" accept="image/*">
          </div>

          <div class="form-group">
            <label class="form-label">Информация о себе</label>
            <textarea class="textarea" id="set-bio" placeholder="Расскажите о себе...">${escapeHtml(currentProfile.bio || "")}</textarea>
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="save-profile-btn">Сохранить изменения</button>
            <a href="${appUrl(currentProfile.username)}" class="btn" data-nav>Открыть профиль</a>
            <button class="btn btn-danger" onclick="logoutUser()">Выйти</button>
          </div>
        </div>
      `;

      document.getElementById("save-profile-btn").addEventListener("click", async (e) => {
        const btn = e.target;
        btn.disabled = true;
        btn.textContent = "Сохранение...";
        try {
          let avatarUrl = currentProfile.avatar_url;
          let bannerUrl = currentProfile.banner_url;
          const avatarFile = document.getElementById("set-avatar").files[0];
          const bannerFile = document.getElementById("set-banner").files[0];
          const bio = document.getElementById("set-bio").value.trim();

          if (avatarFile) avatarUrl = await uploadMediaFile(avatarFile, "avatars", currentProfile.id);
          if (bannerFile) bannerUrl = await uploadMediaFile(bannerFile, "banners", currentProfile.id);

          const { error } = await sb
            .from("profiles")
            .update({ avatar_url: avatarUrl, banner_url: bannerUrl, bio })
            .eq("id", currentProfile.id);

          if (error) throw error;
          navigateSmooth(appUrl(currentProfile.username));
        } catch (err) {
          alert("Ошибка сохранения: " + err.message);
          btn.disabled = false;
          btn.textContent = "Сохранить изменения";
        }
      });
    }

    // ==========================================
    // ЛИЧНЫЙ ПРОФИЛЬ ИГРОКА (/(никнейм))
    // ==========================================
    async function renderProfilePage(root, username) {
      const { data: profile } = sb
        ? await sb.from("profiles").select("*").eq("username", username).maybeSingle()
        : { data: null };

      if (!profile) {
        document.title = "Spark MC — Страница не найдена";
        root.innerHTML = `
          <div class="card form-card" style="text-align:center;">
            <h2 style="margin-bottom:10px;">Профиль «${escapeHtml(username)}» не найден</h2>
            <p style="color:var(--muted); margin-bottom:20px;">Возможно, такой игрок ещё не регистрировался на сайте.</p>
            <a href="${appUrl("")}" class="btn btn-primary" data-nav>На главную</a>
          </div>
        `;
        return;
      }

      document.title = `${profile.username} — Spark MC`;
      const isOwner = currentProfile && currentProfile.id === profile.id;
      const avatar = profile.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
      const bannerStyle = profile.banner_url ? `background-image: url('${escapeHtml(profile.banner_url)}');` : "";

      let ownerButtons = "";
      if (isOwner) {
        ownerButtons = `
          <a href="${appUrl("settings")}" class="btn" data-nav>Редактировать</a>
          <button class="btn btn-danger" onclick="logoutUser()">Выйти</button>
        `;
      } else if (isCurrentUserAdmin()) {
        ownerButtons = `<a href="${appUrl("admin")}" class="btn" data-nav>Изменить в админке</a>`;
      }

      const adminTag = profile.username === ADMIN_USERNAME
        ? `<span class="admin-badge">Создатель</span>`
        : "";

      root.innerHTML = `
        <div class="profile-card">
          <div class="profile-banner" style="${bannerStyle}"></div>
          <div class="profile-body">
            <div class="profile-top">
              <img class="profile-avatar" src="${escapeHtml(avatar)}" alt="">
              <div class="profile-actions">${ownerButtons}</div>
            </div>
            <div class="profile-name">${escapeHtml(profile.username)} ${adminTag}</div>
            <div class="profile-bio">${escapeHtml(profile.bio || "Пользователь пока ничего не рассказал о себе.")}</div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // АДМИН-ПАНЕЛЬ (ТОЛЬКО ДЛЯ melvkin_0)
    // ==========================================
    async function renderAdminPage(root) {
      document.title = "Spark MC — Админ-панель";

      if (!isCurrentUserAdmin()) {
        root.innerHTML = `
          <div class="card form-card" style="text-align:center;">
            <h2 style="margin-bottom:10px;">Доступ закрыт</h2>
            <p style="color:var(--muted); margin-bottom:20px;">Эта страница доступна только владельцу проекта (${ADMIN_USERNAME}).</p>
            <a href="${appUrl("")}" class="btn btn-primary" data-nav>Вернуться на главную</a>
          </div>
        `;
        return;
      }

      const [{ data: profiles }, { data: newsList }] = await Promise.all([
        sb.from("profiles").select("*").order("created_at", { ascending: false }),
        sb.from("news").select("*").order("created_at", { ascending: false })
      ]);

      const allProfiles = profiles || [];
      const allNews = newsList || [];

      root.innerHTML = `
        <div style="margin-bottom:24px;">
          <h1 style="font-size:28px; margin-bottom:6px;">Админ-панель Spark MC</h1>
          <p style="color:var(--muted); font-size:14px;">Управление новостями и профилями всех участников проекта.</p>
        </div>

        <div class="admin-grid">
          <!-- Колонка 1: Публикация и управление новостями -->
          <div>
            <div class="card" style="margin-bottom:20px;">
              <h3 style="margin-bottom:14px;">Опубликовать новость</h3>
              <div class="form-group">
                <label class="form-label">Заголовок</label>
                <input class="input" type="text" id="news-title" placeholder="Например: Открытие сезона Spark MC">
              </div>
              <div class="form-group">
                <label class="form-label">Текст новости</label>
                <textarea class="textarea" id="news-content" placeholder="Подробности обновления..."></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">Картинка к новости (необязательно)</label>
                <input class="input" type="file" id="news-image" accept="image/*">
              </div>
              <button class="btn btn-primary" id="publish-news-btn">Опубликовать</button>
            </div>

            <div class="card">
              <h3 style="margin-bottom:14px;">Опубликованные новости (${allNews.length})</h3>
              ${allNews.length ? allNews.map(n => `
                <div class="user-row">
                  <div style="min-width:0;">
                    <div style="font-size:14px; font-weight:600; margin-bottom:2px;">${escapeHtml(n.title)}</div>
                    <div style="font-size:12px; color:var(--muted);">${new Date(n.created_at).toLocaleDateString("ru-RU")}</div>
                  </div>
                  <button class="btn btn-danger" style="padding:6px 10px; font-size:12px;" onclick="deleteNewsItem(${n.id})">Удалить</button>
                </div>
              `).join("") : `<p style="color:var(--muted); font-size:13px;">Новостей пока нет.</p>`}
            </div>
          </div>

          <!-- Колонка 2: Все профили игроков -->
          <div class="card">
            <h3 style="margin-bottom:14px;">Все профили игроков (${allProfiles.length})</h3>
            <div>
              ${allProfiles.map(p => {
                const av = p.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
                return `
                  <div class="user-row">
                    <div class="user-row-info">
                      <img src="${escapeHtml(av)}" alt="">
                      <div>
                        <a href="${appUrl(p.username)}" class="user-row-name" data-nav>/${escapeHtml(p.username)}</a>
                        <div class="user-row-bio">${escapeHtml(p.bio || "Без описания")}</div>
                      </div>
                    </div>
                    <div style="display:flex; gap:6px; flex-shrink:0;">
                      <a href="${appUrl(p.username)}" class="btn" style="padding:6px 10px; font-size:12px;" data-nav>Открыть</a>
                      <button class="btn btn-primary" style="padding:6px 10px; font-size:12px;" onclick='openEditUserModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Изменить</button>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>

        <!-- Модальное окно редактирования любого профиля -->
        <div class="modal-backdrop" id="edit-user-modal">
          <div class="card form-card" style="max-width:480px;">
            <h3 style="margin-bottom:14px;">Редактировать профиль: <span id="modal-username"></span></h3>
            <input type="hidden" id="modal-user-id">
            <div class="form-group">
              <label class="form-label">Никнейм (ссылка /никнейм)</label>
              <input class="input" type="text" id="modal-edit-username">
            </div>
            <div class="form-group">
              <label class="form-label">Загрузить новую аватарку</label>
              <input class="input" type="file" id="modal-edit-avatar" accept="image/*">
            </div>
            <div class="form-group">
              <label class="form-label">Загрузить новый баннер</label>
              <input class="input" type="file" id="modal-edit-banner" accept="image/*">
            </div>
            <div class="form-group">
              <label class="form-label">Информация о себе</label>
              <textarea class="textarea" id="modal-edit-bio"></textarea>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
              <button class="btn" onclick="closeEditUserModal()">Отмена</button>
              <button class="btn btn-primary" id="modal-save-user-btn">Сохранить</button>
            </div>
          </div>
        </div>
      `;

      // Публикация новости
      document.getElementById("publish-news-btn").addEventListener("click", async (e) => {
        const title = document.getElementById("news-title").value.trim();
        const content = document.getElementById("news-content").value.trim();
        const imgFile = document.getElementById("news-image").files[0];

        if (!title || !content) {
          alert("Заполните заголовок и текст новости.");
          return;
        }

        const btn = e.target;
        btn.disabled = true;
        btn.textContent = "Публикация...";

        try {
          let imageUrl = "";
          if (imgFile) {
            imageUrl = await uploadMediaFile(imgFile, "news", currentProfile.id);
          }
          const { error } = await sb.from("news").insert({
            title,
            content,
            image_url: imageUrl,
            author: currentProfile.username
          });
          if (error) throw error;
          navigateSmooth(appUrl("updates"));
        } catch (err) {
          alert("Ошибка публикации: " + err.message);
          btn.disabled = false;
          btn.textContent = "Опубликовать";
        }
      });

      // Сохранение отредактированного профиля игрока
      document.getElementById("modal-save-user-btn").addEventListener("click", async (e) => {
        const userId = document.getElementById("modal-user-id").value;
        const newUsername = document.getElementById("modal-edit-username").value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
        const bio = document.getElementById("modal-edit-bio").value.trim();
        const avatarFile = document.getElementById("modal-edit-avatar").files[0];
        const bannerFile = document.getElementById("modal-edit-banner").files[0];

        if (!newUsername) {
          alert("Никнейм не может быть пустым.");
          return;
        }

        const btn = e.target;
        btn.disabled = true;
        btn.textContent = "Сохранение...";

        try {
          const updates = { username: newUsername, bio };
          if (avatarFile) updates.avatar_url = await uploadMediaFile(avatarFile, "avatars", userId);
          if (bannerFile) updates.banner_url = await uploadMediaFile(bannerFile, "banners", userId);

          const { error } = await sb.from("profiles").update(updates).eq("id", userId);
          if (error) throw error;
          window.location.reload();
        } catch (err) {
          alert("Ошибка обновления профиля: " + err.message);
          btn.disabled = false;
          btn.textContent = "Сохранить";
        }
      });
    }

    function openEditUserModal(profile) {
      document.getElementById("modal-user-id").value = profile.id;
      document.getElementById("modal-username").textContent = profile.username;
      document.getElementById("modal-edit-username").value = profile.username;
      document.getElementById("modal-edit-bio").value = profile.bio || "";
      document.getElementById("modal-edit-avatar").value = "";
      document.getElementById("modal-edit-banner").value = "";
      document.getElementById("edit-user-modal").classList.add("open");
    }

    function closeEditUserModal() {
      document.getElementById("edit-user-modal").classList.remove("open");
    }

    async function deleteNewsItem(id) {
      if (!confirm("Удалить эту новость?")) return;
      const { error } = await sb.from("news").delete().eq("id", id);
      if (error) {
        alert("Ошибка удаления: " + error.message);
      } else {
        window.location.reload();
      }
    }
  </script>
</body>
</html>
