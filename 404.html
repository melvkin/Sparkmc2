<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@melvkin_</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Подключаем config.js строго от корня репозитория, даже если открыт вложенный путь
    const base = (() => {
      const p = window.location.pathname.split('/').filter(Boolean);
      return (window.location.hostname.endsWith('github.io') && p.length > 0) ? '/' + p[0] + '/' : '/';
    })();
    document.write('<script src="' + base + 'config.js?v=5"><\/script>');
  </script>
</head>
<body>
  <div class="page-shell">
    <main class="content" id="dynamic-root"></main>
  </div>

  <script>
    (async () => {
      const relPath = window.location.pathname
        .replace(BASE_PATH, '')
        .replace(/^\/+|\/+$/g, '')
        .toLowerCase();

      const root = document.getElementById('dynamic-root');

      // 1. Страница /updates (Новости)
      if (relPath === 'updates' || relPath === 'updates.html') {
        document.title = '@melvkin_ — Новости';
        await initLayout('updates');
        root.innerHTML = `
          <h1 class="page-title">Новости разработки</h1>
          <p class="page-subtitle">Актуальный статус создания проекта @melvkin_.</p>
          <div style="display:flex; flex-direction:column; gap:14px;">
            <div class="card">
              <div style="font-size:12.5px; color:var(--muted); margin-bottom:6px;">Этап 02 • Сайт и профили</div>
              <h3 style="font-size:17px; margin-bottom:6px;">Запущена авторизация через Discord и личные страницы</h3>
              <p style="color:var(--muted); font-size:14.5px; line-height:1.6;">Теперь каждый участник может войти через Discord, настроить собственный баннер, аватарку и описание на странице вида <strong>/никнейм</strong>.</p>
            </div>
            <div class="card">
              <div style="font-size:12.5px; color:var(--muted); margin-bottom:6px;">Этап 01 • Концепция</div>
              <h3 style="font-size:17px; margin-bottom:6px;">Проработка лора и базовых механик</h3>
              <p style="color:var(--muted); font-size:14.5px; line-height:1.6;">Формируется сюжетная основа мира и баланс игровых систем первого сезона.</p>
            </div>
          </div>
        `;
        return;
      }

      // 2. Страница /settings (Настройки профиля)
      if (relPath === 'settings' || relPath === 'settings.html') {
        document.title = '@melvkin_ — Настройки профиля';
        const profile = await initLayout('settings');

        if (!profile) {
          root.innerHTML = `
            <div class="card" style="max-width:460px; margin:40px auto; text-align:center;">
              <h2 style="font-size:20px; margin-bottom:10px;">Требуется авторизация</h2>
              <p style="color:var(--muted); font-size:14.5px; margin-bottom:20px;">Войдите через Discord, чтобы настроить свой профиль.</p>
              <button class="btn btn-discord" type="button" onclick="loginWithDiscord()">Войти через Discord</button>
            </div>
          `;
          return;
        }

        root.innerHTML = `
          <div style="max-width:620px; width:100%; margin:0 auto;">
            <h1 class="page-title">Настройки профиля</h1>
            <p class="page-subtitle">Измените баннер, аватарку или расскажите о себе.</p>

            <form class="card" id="settings-form">
              <div class="form-group">
                <label class="form-label">Никнейм (закреплён за аккаунтом)</label>
                <input class="form-input" type="text" value="${profile.username}" readonly>
              </div>

              <div class="form-group">
                <label class="form-label">Аватарка (загрузить изображение)</label>
                <input class="form-input" type="file" id="input-avatar" accept="image/*">
              </div>

              <div class="form-group">
                <label class="form-label">Баннер профиля (загрузить изображение)</label>
                <input class="form-input" type="file" id="input-banner" accept="image/*">
              </div>

              <div class="form-group">
                <label class="form-label">Информация о себе</label>
                <textarea class="form-textarea" id="input-bio" placeholder="Напишите пару слов о себе...">${profile.bio || ''}</textarea>
              </div>

              <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; align-items:center; margin-top:24px;">
                <div style="display:flex; gap:10px;">
                  <button class="btn btn-primary" type="submit" id="btn-save">Сохранить</button>
                  <a href="${appUrl(profile.username)}" class="btn" data-nav>Открыть профиль</a>
                </div>
                <button class="btn btn-danger" type="button" onclick="logoutAccount()">Выйти из аккаунта</button>
              </div>
              <div id="save-status" style="margin-top:14px; font-size:13.5px; color:#22c55e;"></div>
            </form>
          </div>
        `;

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = document.getElementById('btn-save');
          const status = document.getElementById('save-status');
          btn.disabled = true;
          btn.textContent = 'Сохранение...';
          status.textContent = '';

          let avatarUrl = profile.avatar_url || '';
          let bannerUrl = profile.banner_url || '';
          const bioText = document.getElementById('input-bio').value.trim();

          const avatarFile = document.getElementById('input-avatar').files[0];
          const bannerFile = document.getElementById('input-banner').files[0];

          if (avatarFile) {
            const ext = avatarFile.name.split('.').pop();
            const path = `${profile.id}/avatar_${Date.now()}.${ext}`;
            const { error: upErr } = await sb.storage.from('media').upload(path, avatarFile, { upsert: true });
            if (!upErr) {
              const { data: pub } = sb.storage.from('media').getPublicUrl(path);
              avatarUrl = pub.publicUrl;
            }
          }

          if (bannerFile) {
            const ext = bannerFile.name.split('.').pop();
            const path = `${profile.id}/banner_${Date.now()}.${ext}`;
            const { error: upErr } = await sb.storage.from('media').upload(path, bannerFile, { upsert: true });
            if (!upErr) {
              const { data: pub } = sb.storage.from('media').getPublicUrl(path);
              bannerUrl = pub.publicUrl;
            }
          }

          const { error } = await sb
            .from('profiles')
            .update({
              avatar_url: avatarUrl,
              banner_url: bannerUrl,
              bio: bioText
            })
            .eq('id', profile.id);

          btn.disabled = false;
          btn.textContent = 'Сохранить';

          if (error) {
            status.style.color = '#ef4444';
            status.textContent = 'Ошибка сохранения: ' + error.message;
          } else {
            status.style.color = '#22c55e';
            status.textContent = 'Изменения сохранены!';
            setTimeout(() => navigateSmooth(appUrl(profile.username)), 600);
          }
        });
        return;
      }

      // 3. Страница профиля /(никнейм)
      const currentProfile = await initLayout('');
      const targetUsername = decodeURIComponent(relPath);

      const { data: viewedProfile } = await sb
        .from('profiles')
        .select('*')
        .eq('username', targetUsername)
        .maybeSingle();

      if (!viewedProfile) {
        document.title = 'Профиль не найден — @melvkin_';
        root.innerHTML = `
          <div class="card" style="max-width:460px; margin:60px auto; text-align:center;">
            <h2 style="font-size:22px; margin-bottom:8px;">404 — Страница не найдена</h2>
            <p style="color:var(--muted); font-size:14.5px; margin-bottom:20px;">Пользователь <strong>/${targetUsername}</strong> не существует.</p>
            <a href="${appUrl('')}" class="btn btn-primary" data-nav>На главную</a>
          </div>
        `;
        return;
      }

      document.title = `${viewedProfile.username} — @melvkin_`;
      const isOwner = currentProfile && currentProfile.id === viewedProfile.id;
      const avatarSrc = viewedProfile.avatar_url || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231f1f28"/></svg>';
      const bannerStyle = viewedProfile.banner_url ? `background-image: url('${viewedProfile.banner_url}');` : '';

      root.innerHTML = `
        <div class="profile-card">
          <div class="profile-banner" style="${bannerStyle}"></div>
          <div class="profile-body">
            <div class="profile-top">
              <img class="profile-avatar" src="${avatarSrc}" alt="${viewedProfile.username}">
              ${isOwner ? `
                <div class="profile-actions">
                  <a href="${appUrl('settings')}" class="btn" data-nav>Редактировать</a>
                  <button class="btn btn-danger" type="button" onclick="logoutAccount()">Выйти</button>
                </div>
              ` : ''}
            </div>
            <div class="profile-username">${viewedProfile.username}</div>
            <div class="profile-bio ${viewedProfile.bio ? '' : 'empty'}">${viewedProfile.bio ? viewedProfile.bio.replace(/</g, '&lt;') : 'Пользователь пока ничего не рассказал о себе.'}</div>
          </div>
        </div>
      `;
    })();
  </script>
</body>
</html>
