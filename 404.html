<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@melvkin_</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    .profile-banner {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(135deg, #1a1e29 0%, #111318 100%);
      display: block;
    }
    .profile-head {
      padding: 0 28px 28px;
      position: relative;
    }
    .profile-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--surface);
      margin-top: -48px;
      background: #1f2430;
      display: block;
    }
    .ach-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .ach-icon {
      font-size: 24px;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .field-label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input-box {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
    }
    .input-box:focus { outline: none; border-color: var(--accent); }
    .input-box:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container" id="app-root">
    <div class="card" style="text-align:center;padding:48px 20px;color:var(--muted);">
      Загрузка страницы...
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script>
    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderUpdatesPage() {
      document.title = "Обновления — @melvkin_";
      document.getElementById("app-root").innerHTML = `
        <div style="max-width: 680px; margin: 0 auto;">
          <div style="margin-bottom: 24px;">
            <div class="badge" style="margin-bottom: 10px;">/upd • Дневник разработки</div>
            <h1 style="font-size: 28px; letter-spacing: -0.02em;">Обновления проекта</h1>
          </div>

          <div style="display: flex; flex-direction: column; gap: 16px;">
            <article class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span class="badge">Актуально</span>
                <span style="color:var(--muted);font-size:12px;">Этап 1</span>
              </div>
              <h2 style="font-size: 18px; margin-bottom: 8px;">Запуск сайта, профилей и ачивок</h2>
              <p style="color: var(--muted); font-size: 14px;">
                Подключили авторизацию через Discord, личные страницы игроков по адресу <code>/никнейм</code>, загрузку баннеров, аватарок и систему достижений.
              </p>
            </article>

            <article class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="color:var(--muted);font-size:12px;">В планах</span>
              </div>
              <h2 style="font-size: 18px; margin-bottom: 8px;">Лор и игровые механики</h2>
              <p style="color: var(--muted); font-size: 14px;">
                Прорабатываем сюжетную основу мира и уникальные механики. Следите за новостями, чтобы узнать о запуске первыми.
              </p>
            </article>
          </div>
        </div>
      `;
    }

    async function uploadMediaFile(userId, file, folder) {
      const ext = file.name.split(".").pop().toLowerCase() || "png";
      const filePath = `${userId}/${folder}_${Date.now()}.${ext}`;
      const { error } = await sb.storage.from("media").upload(filePath, file, { upsert: true });
      if (error) throw error;
      const { data } = sb.storage.from("media").getPublicUrl(filePath);
      return data.publicUrl;
    }

    async function renderSettingsPage() {
      document.title = "Настройки профиля — @melvkin_";
      const root = document.getElementById("app-root");
      const auth = await getCurrentProfile();

      if (!auth || !auth.profile) {
        root.innerHTML = `
          <div class="card" style="max-width:480px;margin:40px auto;text-align:center;padding:36px 24px;">
            <h2 style="margin-bottom:10px;">Требуется вход</h2>
            <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Войдите через Discord, чтобы настроить свой баннер, аватарку и описание профиля.</p>
            <button class="btn btn-discord" onclick="loginWithDiscord()">Войти через Discord</button>
          </div>
        `;
        return;
      }

      const p = auth.profile;
      const av = p.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
      const bn = p.banner_url || "";

      root.innerHTML = `
        <div class="card" style="max-width: 620px; margin: 0 auto;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
            <div>
              <h1 style="font-size: 22px;">Настройки профиля</h1>
              <p style="color:var(--muted);font-size:13px;">Ваша ссылка: <a href="${linkTo(p.username)}" style="color:#9aa4ff;">/${p.username}</a></p>
            </div>
            <div style="display:flex;gap:8px;">
              <a href="${linkTo(p.username)}" class="btn btn-sm">Мой профиль</a>
              <button class="btn btn-sm" onclick="logoutDiscord()">Выйти</button>
            </div>
          </div>

          <form id="settings-form" style="display:flex;flex-direction:column;gap:18px;">
            <div>
              <label class="field-label">Никнейм (фиксированный, изменить нельзя)</label>
              <input type="text" class="input-box" value="${escapeHtml(p.username)}" disabled>
            </div>

            <div>
              <label class="field-label">Баннер профиля (рекомендуется 1200×360)</label>
              ${bn ? `<img src="${bn}" id="preview-banner" style="width:100%;height:130px;object-fit:cover;border-radius:10px;margin-bottom:8px;border:1px solid var(--border);">` : `<img id="preview-banner" style="display:none;width:100%;height:130px;object-fit:cover;border-radius:10px;margin-bottom:8px;border:1px solid var(--border);">`}
              <input type="file" id="banner-file" accept="image/*" class="input-box">
            </div>

            <div>
              <label class="field-label">Аватарка</label>
              <div style="display:flex;align-items:center;gap:14px;">
                <img src="${av}" id="preview-avatar" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--border);">
                <input type="file" id="avatar-file" accept="image/*" class="input-box">
              </div>
            </div>

            <div>
              <label class="field-label">Информация о себе</label>
              <textarea id="bio-input" rows="4" maxlength="300" class="input-box" placeholder="Расскажите о себе, своих ролях или интересах на сервере...">${escapeHtml(p.bio || "")}</textarea>
            </div>

            <button type="submit" id="save-btn" class="btn btn-discord">Сохранить изменения</button>
          </form>
        </div>
      `;

      document.getElementById("avatar-file").addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (f) document.getElementById("preview-avatar").src = URL.createObjectURL(f);
      });

      document.getElementById("banner-file").addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (f) {
          const img = document.getElementById("preview-banner");
          img.src = URL.createObjectURL(f);
          img.style.display = "block";
        }
      });

      document.getElementById("settings-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("save-btn");
        btn.disabled = true;
        btn.textContent = "Сохранение...";

        try {
          let newAvatar = p.avatar_url;
          let newBanner = p.banner_url;
          const avatarFile = document.getElementById("avatar-file").files[0];
          const bannerFile = document.getElementById("banner-file").files[0];
          const newBio = document.getElementById("bio-input").value.trim();

          if (avatarFile) newAvatar = await uploadMediaFile(p.id, avatarFile, "avatar");
          if (bannerFile) newBanner = await uploadMediaFile(p.id, bannerFile, "banner");

          const { error } = await sb
            .from("profiles")
            .update({ avatar_url: newAvatar, banner_url: newBanner, bio: newBio })
            .eq("id", p.id);

          if (error) throw error;

          if (newBio.length > 0 || avatarFile || bannerFile) {
            await unlockAchievement("designer");
          }

          showToast("Профиль успешно сохранён!");
          setTimeout(() => { window.location.href = linkTo(p.username); }, 800);
        } catch (err) {
          showToast("Ошибка сохранения: " + err.message);
          btn.disabled = false;
          btn.textContent = "Сохранить изменения";
        }
      });
    }

    async function renderUserProfile(username) {
      const root = document.getElementById("app-root");
      if (!sb) {
        root.innerHTML = `<div class="card">Подключите ключ Supabase в <b>config.js</b>.</div>`;
        return;
      }

      const cleanUser = username.toLowerCase();
      const { data: profile } = await sb
        .from("profiles")
        .select("*")
        .eq("username", cleanUser)
        .maybeSingle();

      if (!profile) {
        document.title = "Профиль не найден — @melvkin_";
        root.innerHTML = `
          <div class="card" style="max-width:480px;margin:40px auto;text-align:center;padding:40px 24px;">
            <div style="font-size:32px;margin-bottom:10px;">404</div>
            <h2 style="margin-bottom:8px;">Игрок /${escapeHtml(username)} не найден</h2>
            <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Такого профиля ещё нет или адрес введён с опечаткой.</p>
            <a href="${linkTo("")}" class="btn">На главную</a>
          </div>
        `;
        return;
      }

      document.title = `${profile.username} — Профиль @melvkin_`;
      const auth = await getCurrentProfile();
      const isOwner = auth && auth.profile && auth.profile.id === profile.id;

      const { data: userAchs } = await sb
        .from("user_achievements")
        .select("unlocked_at, achievements(title, description, icon)")
        .eq("user_id", profile.id)
        .order("unlocked_at", { ascending: true });

      const av = profile.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
      const bannerHtml = profile.banner_url
        ? `<img src="${profile.banner_url}" class="profile-banner" alt="Баннер">`
        : `<div class="profile-banner"></div>`;

      const achsHtml = (userAchs && userAchs.length > 0)
        ? userAchs.map(item => {
            const a = item.achievements;
            return `
              <div class="ach-card">
                <div class="ach-icon">${escapeHtml(a.icon)}</div>
                <div>
                  <div style="font-weight:600;font-size:14px;">${escapeHtml(a.title)}</div>
                  <div style="color:var(--muted);font-size:12px;">${escapeHtml(a.description)}</div>
                </div>
              </div>
            `;
          }).join("")
        : `<p style="color:var(--muted);font-size:14px;">У игрока пока нет полученных ачивок.</p>`;

      root.innerHTML = `
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:20px;">
          ${bannerHtml}
          <div class="profile-head">
            <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
              <img src="${av}" class="profile-avatar" alt="${escapeHtml(profile.username)}">
              ${isOwner ? `<a href="${linkTo("settings")}" class="btn btn-sm">✏️ Настроить профиль</a>` : ""}
            </div>
            <h1 style="font-size:24px;letter-spacing:-0.02em;margin-bottom:4px;">${escapeHtml(profile.username)}</h1>
            <div style="color:var(--muted);font-size:13px;margin-bottom:16px;">Профиль участника • /${escapeHtml(profile.username)}</div>
            <div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;font-size:14px;white-space:pre-wrap;">${profile.bio ? escapeHtml(profile.bio) : '<span style="color:var(--muted);">Игрок пока ничего не написал о себе.</span>'}</div>
          </div>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="font-size:18px;">Ачивки</h2>
            <span class="badge">Получено: ${userAchs ? userAchs.length : 0}</span>
          </div>
          <div class="grid-2">
            ${achsHtml}
          </div>
        </div>
      `;
    }

    (async () => {
      const route = getCurrentRoute();
      await renderLayout(route.toLowerCase());
      if (route.toLowerCase() === "upd") {
        renderUpdatesPage();
      } else if (route.toLowerCase() === "settings") {
        await renderSettingsPage();
      } else if (route) {
        await renderUserProfile(route);
      } else {
        window.location.href = linkTo("");
      }
    })();
  </script>
</body>
</html>
