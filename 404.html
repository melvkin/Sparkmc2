<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark MC</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const base = window.location.pathname.startsWith("/Sparkmc2") ? "/Sparkmc2" : "";
    const s = document.createElement("script");
    s.src = base + "/config.js?v=7";
    document.head.appendChild(s);
  </script>
</head>
<body>
  <main class="fullscreen-main" id="app-root">
    <div class="hero-center">
      <p class="hero-sub">Загрузка...</p>
    </div>
  </main>

  <script>
    window.addEventListener("load", () => {
      const root = document.getElementById("app-root");
      const rawPath = window.location.pathname.replace(/^\/Sparkmc2/, "").replace(/^\/|\/$/g, "");
      const route = rawPath.toLowerCase();

      if (route === "updates" || route === "upd") {
        document.title = "Spark MC — Новости";
        initSparkApp("updates", () => {
          root.innerHTML = `
            <div class="hero-center" style="margin-bottom: 12px;">
              <div class="badge">Дневник разработки · @melvkin_</div>
              <h1 class="hero-title" style="font-size: clamp(28px, 4.5vw, 42px);">Обновления Spark MC</h1>
              <p class="hero-sub">Актуальные этапы запуска сервера и развития веб-платформы.</p>
            </div>
            <div class="grid-cards">
              <div class="card">
                <h3>Авторизация и профили игроков</h3>
                <p>Запущен вход через Discord и автоматическое создание персональных страниц игроков по адресу <strong>/никнейм</strong>.</p>
              </div>
              <div class="card">
                <h3>Подготовка мира и механик</h3>
                <p>Идёт проработка лора первого сезона, настройка сервера и тестирование уникальных игровых механик.</p>
              </div>
            </div>
          `;
        });
        return;
      }

      if (route === "settings") {
        document.title = "Spark MC — Настройки профиля";
        initSparkApp("settings", async (user, profile) => {
          if (!user || !profile) {
            root.innerHTML = `
              <div class="hero-center">
                <h1 class="hero-title" style="font-size: 30px;">Требуется вход</h1>
                <p class="hero-sub">Войдите через Discord, чтобы настроить свой баннер, аватарку и описание профиля.</p>
                <div class="hero-actions">
                  <button class="btn btn-primary" onclick="loginWithDiscord(this)">Войти через Discord</button>
                </div>
              </div>
            `;
            return;
          }

          root.innerHTML = `
            <div class="profile-wrap" style="padding: 28px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                <h1 style="font-size: 22px; font-weight: 700;">Настройки профиля</h1>
                <div style="display:flex; gap:8px;">
                  <a href="${appUrl("/" + profile.username)}" class="btn">Открыть профиль</a>
                  <button class="btn btn-danger" onclick="logoutUser()">Выйти</button>
                </div>
              </div>

              <div class="form-group">
                <label>Ваш постоянный никнейм (ссылка: /${profile.username})</label>
                <input class="input" type="text" value="${profile.username}" readonly>
              </div>

              <div class="form-group">
                <label>Аватарка (выберите картинку с устройства)</label>
                <input class="input" type="file" id="avatar-file" accept="image/*">
              </div>

              <div class="form-group">
                <label>Баннер профиля (выберите картинку с устройства)</label>
                <input class="input" type="file" id="banner-file" accept="image/*">
              </div>

              <div class="form-group">
                <label>Информация о себе</label>
                <textarea class="textarea" id="bio-input" placeholder="Расскажите немного о себе или своём персонаже на Spark MC...">${profile.bio || ""}</textarea>
              </div>

              <button class="btn btn-primary" id="save-profile-btn">Сохранить изменения</button>
            </div>
          `;

          document.getElementById("save-profile-btn").addEventListener("click", async () => {
            const btn = document.getElementById("save-profile-btn");
            btn.disabled = true;
            btn.textContent = "Сохранение...";

            let avatarUrl = profile.avatar_url || "";
            let bannerUrl = profile.banner_url || "";
            const bioText = document.getElementById("bio-input").value.trim();

            const avatarFile = document.getElementById("avatar-file").files[0];
            const bannerFile = document.getElementById("banner-file").files[0];

            try {
              if (avatarFile) {
                const ext = avatarFile.name.split(".").pop() || "png";
                const path = `${user.id}/avatar_${Date.now()}.${ext}`;
                const { error: upErr } = await sb.storage.from("media").upload(path, avatarFile, { upsert: true });
                if (upErr) throw upErr;
                const { data: pub } = sb.storage.from("media").getPublicUrl(path);
                avatarUrl = pub.publicUrl;
              }

              if (bannerFile) {
                const ext = bannerFile.name.split(".").pop() || "png";
                const path = `${user.id}/banner_${Date.now()}.${ext}`;
                const { error: upErr } = await sb.storage.from("media").upload(path, bannerFile, { upsert: true });
                if (upErr) throw upErr;
                const { data: pub } = sb.storage.from("media").getPublicUrl(path);
                bannerUrl = pub.publicUrl;
              }

              const { error: dbErr } = await sb
                .from("profiles")
                .update({ avatar_url: avatarUrl, banner_url: bannerUrl, bio: bioText })
                .eq("id", user.id);

              if (dbErr) throw dbErr;

              showToast("Профиль успешно обновлён");
              setTimeout(() => navigateSmooth(appUrl("/" + profile.username)), 500);
            } catch (err) {
              showToast("Ошибка сохранения: " + (err.message || "попробуйте снова"));
              btn.disabled = false;
              btn.textContent = "Сохранить изменения";
            }
          });
        });
        return;
      }

      // Профиль игрока /(никнейм)
      initSparkApp("profile", async (user, myProfile) => {
        if (!rawPath || !sb) {
          root.innerHTML = `
            <div class="hero-center">
              <h1 class="hero-title" style="font-size: 32px;">Страница не найдена</h1>
              <a href="${appUrl("/")}" class="btn btn-primary">На главную</a>
            </div>
          `;
          return;
        }

        const { data: target } = await sb
          .from("profiles")
          .select("*")
          .ilike("username", rawPath)
          .maybeSingle();

        if (!target) {
          document.title = "Spark MC — Профиль не найден";
          root.innerHTML = `
            <div class="hero-center">
              <h1 class="hero-title" style="font-size: 32px;">Игрок не найден</h1>
              <p class="hero-sub">Профиль <strong>/${rawPath}</strong> ещё не зарегистрирован на Spark MC.</p>
              <a href="${appUrl("/")}" class="btn btn-primary">Вернуться на главную</a>
            </div>
          `;
          return;
        }

        document.title = `${target.username} — Spark MC`;
        const isOwner = user && user.id === target.id;
        const ava = target.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
        const bannerStyle = target.banner_url ? `background-image: url('${target.banner_url}')` : "";
        const bioHtml = target.bio
          ? `<div class="profile-bio">${target.bio.replace(/</g, "&lt;")}</div>`
          : `<div class="profile-bio" style="color: var(--muted);">Пользователь пока не добавил информацию о себе.</div>`;

        const ownerButtons = isOwner
          ? `
            <div class="profile-actions">
              <a href="${appUrl("/settings")}" class="btn btn-primary">Редактировать</a>
              <button class="btn btn-danger" onclick="logoutUser()">Выйти</button>
            </div>
          `
          : "";

        root.innerHTML = `
          <div class="profile-wrap">
            <div class="profile-banner" style="${bannerStyle}"></div>
            <div class="profile-body">
              <div class="profile-top">
                <img class="profile-avatar" src="${ava}" alt="${target.username}">
                ${ownerButtons}
              </div>
              <div class="profile-name">${target.username}</div>
              <div class="profile-handle">Игрок Spark MC · /${target.username}</div>
              ${bioHtml}
            </div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
