<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@melvkin_</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Sparkmc2/config.js?v=3"></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="page-container" id="app"></main>

  <script>
    function escapeHtml(str) {
      return (str || "").replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    async function renderDynamicPage() {
      const app = document.getElementById("app");
      const route = getRoute();

      // Если перешли на /ads без .html
      if (route === "ads") {
        window.location.replace(makeUrl("ads.html"));
        return;
      }

      // Настройки профиля (/settings)
      if (route === "settings") {
        const profile = await getCurrentUserProfile();
        if (!profile) {
          app.innerHTML = `
            <div class="card card-center">
              <h1 class="title">Требуется вход</h1>
              <p class="subtitle" style="margin-bottom: 18px;">Войдите через Discord, чтобы настроить свой профиль.</p>
              <button class="btn btn-primary" onclick="loginWithDiscord()">Войти через Discord</button>
            </div>
          `;
          return;
        }

        app.innerHTML = `
          <div class="card" style="max-width: 480px; width: 100%; margin: 0 auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
              <h1 class="title" style="margin:0;">Настройки профиля</h1>
              <a href="${makeUrl(profile.username)}" class="btn">Мой профиль</a>
            </div>

            <div class="form-group">
              <label class="form-label">Никнейм (постоянная ссылка: /${escapeHtml(profile.username)})</label>
              <input class="form-input" type="text" value="@${escapeHtml(profile.username)}" disabled />
            </div>

            <div class="form-group">
              <label class="form-label">Аватарка</label>
              <input class="form-input" type="file" id="avatarInput" accept="image/*" />
            </div>

            <div class="form-group">
              <label class="form-label">Баннер</label>
              <input class="form-input" type="file" id="bannerInput" accept="image/*" />
            </div>

            <div class="form-group">
              <label class="form-label">Информация о себе</label>
              <textarea class="form-textarea" id="bioInput" placeholder="Напишите пару слов о себе...">${escapeHtml(profile.bio)}</textarea>
            </div>

            <div style="display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top: 22px;">
              <button class="btn btn-primary" id="saveBtn">Сохранить изменения</button>
              <button class="btn btn-danger" onclick="logoutAccount()">Выйти из аккаунта</button>
            </div>
            <div class="toast" id="statusText"></div>
          </div>
        `;

        document.getElementById("saveBtn").addEventListener("click", async () => {
          const btn = document.getElementById("saveBtn");
          const status = document.getElementById("statusText");
          btn.disabled = true;
          status.textContent = "Сохраняем...";

          try {
            let avatarUrl = profile.avatar_url;
            let bannerUrl = profile.banner_url;
            const avatarFile = document.getElementById("avatarInput").files[0];
            const bannerFile = document.getElementById("bannerInput").files[0];
            const bioVal = document.getElementById("bioInput").value.trim();

            if (avatarFile) avatarUrl = await uploadMediaFile(avatarFile, profile.id, "avatar");
            if (bannerFile) bannerUrl = await uploadMediaFile(bannerFile, profile.id, "banner");

            const { error } = await sb
              .from("profiles")
              .update({ avatar_url: avatarUrl, banner_url: bannerUrl, bio: bioVal })
              .eq("id", profile.id);

            if (error) throw error;
            status.textContent = "Сохранено! Переходим в профиль...";
            setTimeout(() => navigateSmooth(makeUrl(profile.username)), 600);
          } catch (err) {
            status.textContent = "Ошибка при сохранении: " + err.message;
            btn.disabled = false;
          }
        });
        return;
      }

      // Профиль игрока (/никнейм) — БЕЗ АЧИВОК
      if (!route || !sb) {
        app.innerHTML = `<div class="card card-center"><h1 class="title">Страница не найдена</h1></div>`;
        return;
      }

      const { data: userProfile } = await sb
        .from("profiles")
        .select("id, username, avatar_url, banner_url, bio")
        .eq("username", route.toLowerCase())
        .single();

      if (!userProfile) {
        app.innerHTML = `
          <div class="card card-center">
            <h1 class="title">Профиль не найден</h1>
            <p class="subtitle" style="margin-bottom:18px;">Пользователь @${escapeHtml(route)} не зарегистрирован.</p>
            <a href="${makeUrl("")}" class="btn">На главную</a>
          </div>
        `;
        return;
      }

      const currentUser = await getCurrentUserProfile();
      const isOwner = currentUser && currentUser.id === userProfile.id;

      const bannerStyle = userProfile.banner_url
        ? `style="background-image: url('${escapeHtml(userProfile.banner_url)}')"`
        : "";
      const avatarSrc = userProfile.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
      const bioHtml = userProfile.bio
        ? `<p class="profile-bio">${escapeHtml(userProfile.bio)}</p>`
        : `<p class="profile-bio" style="opacity:0.5;">Информация о себе пока не заполнена.</p>`;

      const ownerControls = isOwner
        ? `<div style="display:flex; gap:8px;">
             <a href="${makeUrl("settings")}" class="btn">Редактировать</a>
             <button class="btn btn-danger" onclick="logoutAccount()">Выйти</button>
           </div>`
        : "";

      document.title = `@${userProfile.username}`;

      app.innerHTML = `
        <div class="profile-card">
          <div class="profile-banner" ${bannerStyle}></div>
          <div class="profile-body">
            <div class="profile-header-row">
              <img class="profile-avatar" src="${escapeHtml(avatarSrc)}" alt="${escapeHtml(userProfile.username)}" />
              ${ownerControls}
            </div>
            <h1 class="profile-username">@${escapeHtml(userProfile.username)}</h1>
            ${bioHtml}
          </div>
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", renderDynamicPage);
  </script>
</body>
</html>
