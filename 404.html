<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@melvkin_</title>
  <style>
    
:root {
  --bg: #09090b;
  --card: #0f0f12;
  --border: #1e1e24;
  --border-hover: #32323c;
  --text: #f4f4f5;
  --muted: #71717a;
  --accent: #e4e4e7;
  --discord: #5865F2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 28px 20px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 48px;
}
.brand {
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.02em;
  color: var(--text);
}
nav {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 13px;
  color: var(--muted);
}
nav a:hover, nav a.active { color: var(--text); }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--border-hover); background: #15151a; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
.btn-primary {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.btn-primary:hover { background: #d4d4d8; border-color: #d4d4d8; }
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
}
.title {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
.desc {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 22px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
input[type="text"], textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
}
input[type="text"]:focus, textarea:focus { border-color: var(--border-hover); }
input[readonly] { color: var(--muted); cursor: not-allowed; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }

    .banner {
      width: 100%; height: 130px; background: #141418;
      border-bottom: 1px solid var(--border);
      object-fit: cover; display: block;
    }
    .profile-card { padding: 0; overflow: hidden; }
    .profile-body { padding: 0 24px 24px; }
    .avatar {
      width: 68px; height: 68px; border-radius: 50%;
      border: 3px solid var(--card); background: #18181b;
      margin-top: -34px; object-fit: cover; display: block;
    }
    .p-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; margin-bottom: 8px;
    }
    .p-name { font-size: 18px; font-weight: 600; }
    .p-bio { color: var(--muted); font-size: 14px; white-space: pre-wrap; }
    .ach-list {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .ach-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .ach-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--border);
      font-size: 13px;
    }
    .ach-item span.sub { display: block; font-size: 12px; color: var(--muted); }
    .upd-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .upd-item:last-child { border-bottom: none; padding-bottom: 0; }
    .upd-date { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="./" id="brand-link" class="brand">@melvkin_</a>
      <nav id="top-nav"></nav>
    </header>
    <main id="app">
      <div class="box"><div class="desc" style="margin:0">Загрузка...</div></div>
    </main>
  </div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
window.App = (() => {
  const url = (typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL) || 'https://ieybcjpqsrvztfcetcgj.supabase.co';
  const key = (typeof SUPABASE_KEY !== 'undefined' && SUPABASE_KEY) ||
              (typeof SUPABASE_ANON_KEY !== 'undefined' && SUPABASE_ANON_KEY) ||
              (typeof ANON_KEY !== 'undefined' && ANON_KEY) ||
              (typeof PUBLISHABLE_KEY !== 'undefined' && PUBLISHABLE_KEY) ||
              (window.CONFIG && (window.CONFIG.SUPABASE_KEY || window.CONFIG.anonKey || window.CONFIG.key)) || '';
  let client = (typeof sb !== 'undefined' && sb) ||
               (typeof supabaseClient !== 'undefined' && supabaseClient) ||
               (typeof _supabase !== 'undefined' && _supabase) || null;
  if (!client && window.supabase && key) {
    client = window.supabase.createClient(url, key);
  }

  function getBase() {
    const parts = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('.github.io')) {
      const known = ['index.html', 'me.html', 'ads.html', '404.html', 'me', 'ads', 'upd', 'settings'];
      if (parts.length > 0 && !known.includes(parts[0])) {
        return '/' + parts[0] + '/';
      }
    }
    return '/';
  }

  const base = getBase();

  async function login() {
    if (!client) return alert('Не найден ключ в config.js');
    await client.auth.signInWithOAuth({
      provider: 'discord',
      options: { redirectTo: location.origin + base }
    });
  }

  async function logout() {
    if (!client) return;
    await client.auth.signOut();
    location.href = base;
  }

  async function getUserAndProfile() {
    if (!client) return { user: null, profile: null };
    const { data: { session } } = await client.auth.getSession();
    if (!session) return { user: null, profile: null };
    const { data: profile } = await client
      .from('profiles')
      .select('*')
      .eq('id', session.user.id)
      .maybeSingle();
    return { user: session.user, profile };
  }

  async function unlockAchievement(userId, slug) {
    if (!client || !userId) return;
    const { data: ach } = await client.from('achievements').select('id').eq('slug', slug).maybeSingle();
    if (ach) {
      await client.from('user_achievements').upsert(
        { user_id: userId, achievement_id: ach.id },
        { onConflict: 'user_id,achievement_id', ignoreDuplicates: true }
      );
    }
  }

  async function renderHeader(active) {
    const nav = document.getElementById('top-nav');
    if (!nav) return;
    const { profile } = await getUserAndProfile();
    const authHtml = profile
      ? `<a href="${base}${profile.username}" class="${active === 'profile' ? 'active' : ''}">@${profile.username}</a>`
      : `<button class="btn btn-sm" onclick="App.login()">Войти</button>`;
    nav.innerHTML = `
      <a href="${base}" class="${active === 'home' ? 'active' : ''}">главная</a>
      <a href="${base}me.html" class="${active === 'me' ? 'active' : ''}">о проекте</a>
      <a href="${base}upd" class="${active === 'upd' ? 'active' : ''}">обновления</a>
      <a href="${base}ads.html" class="${active === 'ads' ? 'active' : ''}">реклама</a>
      ${authHtml}
    `;
  }

  return { client, base, login, logout, getUserAndProfile, unlockAchievement, renderHeader };
})();
</script>

  <script>
    (async () => {
      const base = App.base;
      document.getElementById('brand-link').href = base;
      const app = document.getElementById('app');

      let rel = location.pathname;
      if (rel.startsWith(base)) rel = rel.slice(base.length);
      const segment = decodeURIComponent(rel.split('/').filter(Boolean)[0] || '').toLowerCase();

      if (segment === 'upd') {
        document.title = 'Обновления — @melvkin_';
        await App.renderHeader('upd');
        app.innerHTML = `
          <div class="box">
            <div class="title">Обновления</div>
            <div class="desc">Здесь появляются новости разработки @melvkin_.</div>
            <div class="upd-item">
              <div class="upd-date">Сейчас</div>
              <div>Запущен сайт, авторизация через Discord, профили и система ачивок.</div>
            </div>
          </div>
        `;
        return;
      }

      if (segment === 'settings') {
        document.title = 'Настройки профиля — @melvkin_';
        await App.renderHeader('profile');
        const { user, profile } = await App.getUserAndProfile();
        if (!user || !profile) {
          app.innerHTML = `
            <div class="box">
              <div class="title">Нужна авторизация</div>
              <div class="desc">Войдите через Discord, чтобы настроить профиль.</div>
              <button class="btn btn-primary" onclick="App.login()">Войти через Discord</button>
            </div>
          `;
          return;
        }
        app.innerHTML = `
          <div class="box">
            <div class="title">Настройки профиля</div>
            <div class="field">
              <label>Никнейм (закреплён)</label>
              <input type="text" value="@${profile.username}" readonly>
            </div>
            <div class="field">
              <label>Аватарка</label>
              <input type="file" id="avatar-file" accept="image/*">
            </div>
            <div class="field">
              <label>Баннер</label>
              <input type="file" id="banner-file" accept="image/*">
            </div>
            <div class="field">
              <label>О себе</label>
              <textarea id="bio-input" rows="3" placeholder="Расскажите о себе...">${profile.bio || ''}</textarea>
            </div>
            <div class="actions">
              <button class="btn btn-primary" id="save-btn">Сохранить</button>
              <a href="${base}${profile.username}" class="btn">К профилю</a>
              <button class="btn" onclick="App.logout()">Выйти</button>
            </div>
            <div id="status-msg" class="desc" style="margin-top:12px;margin-bottom:0"></div>
          </div>
        `;

        document.getElementById('save-btn').onclick = async () => {
          const msg = document.getElementById('status-msg');
          msg.textContent = 'Сохранение...';
          let avatar_url = profile.avatar_url;
          let banner_url = profile.banner_url;
          const bio = document.getElementById('bio-input').value.trim();

          const avFile = document.getElementById('avatar-file').files[0];
          if (avFile) {
            const ext = avFile.name.split('.').pop();
            const path = `${user.id}/avatar_${Date.now()}.${ext}`;
            const { error } = await App.client.storage.from('media').upload(path, avFile, { upsert: true });
            if (!error) avatar_url = App.client.storage.from('media').getPublicUrl(path).data.publicUrl;
          }

          const bnFile = document.getElementById('banner-file').files[0];
          if (bnFile) {
            const ext = bnFile.name.split('.').pop();
            const path = `${user.id}/banner_${Date.now()}.${ext}`;
            const { error } = await App.client.storage.from('media').upload(path, bnFile, { upsert: true });
            if (!error) banner_url = App.client.storage.from('media').getPublicUrl(path).data.publicUrl;
          }

          const { error: upErr } = await App.client
            .from('profiles')
            .update({ avatar_url, banner_url, bio })
            .eq('id', user.id);

          if (upErr) {
            msg.textContent = 'Ошибка сохранения.';
          } else {
            if (bio.length > 0) await App.unlockAchievement(user.id, 'designer');
            msg.textContent = 'Сохранено.';
          }
        };
        return;
      }

      await App.renderHeader('');
      if (!segment || !App.client) {
        app.innerHTML = `<div class="box"><div class="title">Страница не найдена</div><a href="${base}" class="btn">На главную</a></div>`;
        return;
      }

      const { data: target } = await App.client
        .from('profiles')
        .select('*')
        .eq('username', segment)
        .maybeSingle();

      if (!target) {
        document.title = 'Не найдено — @melvkin_';
        app.innerHTML = `
          <div class="box">
            <div class="title">Профиль @${segment} не найден</div>
            <div class="desc">Возможно, этот игрок ещё не заходил на сайт.</div>
            <a href="${base}" class="btn">На главную</a>
          </div>
        `;
        return;
      }

      document.title = `@${target.username} — @melvkin_`;
      const { user } = await App.getUserAndProfile();
      const isOwner = user && user.id === target.id;

      const { data: uAchs } = await App.client
        .from('user_achievements')
        .select('achievements(title, description, icon)')
        .eq('user_id', target.id);

      const achs = (uAchs || []).map(x => x.achievements).filter(Boolean);
      const achsHtml = achs.length
        ? achs.map(a => `<div class="ach-item"><div>${a.icon}</div><div><strong>${a.title}</strong><span class="sub">${a.description}</span></div></div>`).join('')
        : `<div class="desc" style="margin:0">Пока нет ачивок</div>`;

      const bannerTag = target.banner_url
        ? `<img src="${target.banner_url}" class="banner" alt="banner">`
        : `<div class="banner"></div>`;

      const avatarTag = target.avatar_url
        ? `<img src="${target.avatar_url}" class="avatar" alt="avatar">`
        : `<div class="avatar"></div>`;

      app.innerHTML = `
        <div class="box profile-card">
          ${bannerTag}
          <div class="profile-body">
            ${avatarTag}
            <div class="p-head">
              <div class="p-name">@${target.username}</div>
              ${isOwner ? `<a href="${base}settings" class="btn btn-sm">Настроить</a>` : ''}
            </div>
            <div class="p-bio">${target.bio || 'Нет описания.'}</div>
            <div class="ach-list">
              <div class="ach-title">Ачивки (${achs.length})</div>
              ${achsHtml}
            </div>
          </div>
        </div>
      `;
    })();
  </script>
</body>
</html>
