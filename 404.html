<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark MC</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      const base = location.hostname.endsWith("github.io") && location.pathname.startsWith("/Sparkmc2")
        ? "/Sparkmc2"
        : "";
      const s = document.createElement("script");
      s.src = base + "/config.js?v=8";
      s.onload = () => {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", bootDynamicPage);
        } else {
          bootDynamicPage();
        }
      };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <main class="main-wrap" id="app"></main>

  <script>
    async function bootDynamicPage() {
      let rel = location.pathname;
      if (BASE_PATH && rel.startsWith(BASE_PATH)) {
        rel = rel.slice(BASE_PATH.length);
      }
      const slug = decodeURIComponent(rel.replace(/^\/+|\/+$/g, "")).toLowerCase();

      if (slug === "updates") {
        document.title = "Spark MC — Новости";
        await initLayout("updates");
        renderUpdates();
        return;
      }

      if (slug === "settings") {
        document.title = "Spark MC — Настройки профиля";
        const auth = await initLayout("settings");
        renderSettings(auth);
        return;
      }

      await initLayout("profile");
      await renderProfile(slug);
    }

    function renderUpdates() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div style="margin-bottom: 28px;">
          <h1 style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px;">Новости разработки</h1>
          <p style="color: #8e8e98; font-size: 15px;">Актуальный статус создания Spark MC от @melvkin_.</p>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <span style="font-size:12px;color:#22c55e;font-weight:600;">В ПРОЦЕССЕ</span>
              <span style="font-size:12.5px;color:#71717a;">Этап 2</span>
            </div>
            <h2 style="font-size:17px;font-weight:600;margin-bottom:6px;">Проработка лора и игровых механик</h2>
            <p style="font-size:14px;color:#a1a1aa;line-height:1.6;">
              Собираем концепцию мира, ключевые события и уникальные фишки для первого сезона Spark MC.
            </p>
          </div>

          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <span style="font-size:12px;color:#a1a1aa;font-weight:600;">ГОТОВО</span>
              <span style="font-size:12.5px;color:#71717a;">Этап 1</span>
            </div>
            <h2 style="font-size:17px;font-weight:600;margin-bottom:6px;">Запущен сайт и личные профили игроков</h2>
            <p style="font-size:14px;color:#a1a1aa;line-height:1.6;">
              Добавлена авторизация через Discord, настройка баннеров, аватарок, описания о себе и персональные ссылки вида /никнейм.
            </p>
          </div>
        </div>
      `;
    }

    function renderSettings({ user, profile }) {
      const app = document.getElementById("app");
      if (!user || !profile) {
        app.classList.add("centered");
        app.innerHTML = `
          <div class="card" style="max-width: 420px; width: 100%; text-align: center;">
            <h1 style="font-size: 20px; font-weight: 600; margin-bottom: 10px;">Требуется вход</h1>
            <p style="font-size: 14px; color: #8e8e98; margin-bottom: 20px;">Войдите через Discord, чтобы настроить свой профиль на Spark MC.</p>
            <button type="button" class="btn btn-discord" id="settings-login-btn" style="width:100%;">Войти через Discord</button>
          </div>
        `;
        const btn = document.getElementById("settings-login-btn");
        btn?.addEventListener("click", () => loginWithDiscord(btn));
        return;
      }

      const avatar = profile.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
      app.innerHTML = `
        <div style="max-width: 640px; width: 100%; margin: 0 auto;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
            <div>
              <h1 style="font-size: 26px; font-weight: 700; letter-spacing: -0.03em;">Настройки профиля</h1>
              <p style="font-size: 14px; color: #8e8e98;">Ссылка на ваш профиль: <a href="${routeUrl(profile.username)}" style="color:#fff;text-decoration:underline;">/${escapeHtml(profile.username)}</a></p>
            </div>
            <button type="button" class="btn btn-danger" id="settings-logout-btn">Выйти из аккаунта</button>
          </div>

          <div class="card" style="display:flex;flex-direction:column;gap:20px;">
            <div>
              <label style="display:block;font-size:13px;color:#a1a1aa;margin-bottom:6px;">Никнейм (фиксированный)</label>
              <input type="text" value="${escapeHtml(profile.username)}" disabled
                style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:#0c0c0f;color:#71717a;font-size:14px;cursor:not-allowed;">
            </div>

            <div>
              <label style="display:block;font-size:13px;color:#a1a1aa;margin-bottom:8px;">Аватарка</label>
              <div style="display:flex;align-items:center;gap:14px;">
                <img id="preview-avatar" src="${escapeHtml(avatar)}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--border);">
                <input type="file" id="input-avatar" accept="image/*" style="font-size:13px;color:#a1a1aa;">
              </div>
            </div>

            <div>
              <label style="display:block;font-size:13px;color:#a1a1aa;margin-bottom:8px;">Баннер профиля</label>
              <div id="preview-banner" style="width:100%;height:120px;border-radius:12px;border:1px solid var(--border);background:#16161b center/cover no-repeat;margin-bottom:10px;${profile.banner_url ? `background-image:url('${escapeHtml(profile.banner_url)}')` : ""}"></div>
              <input type="file" id="input-banner" accept="image/*" style="font-size:13px;color:#a1a1aa;">
            </div>

            <div>
              <label style="display:block;font-size:13px;color:#a1a1aa;margin-bottom:6px;">Информация о себе</label>
              <textarea id="input-bio" rows="4" maxlength="300" placeholder="Расскажите немного о себе..."
                style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0c0c0f;color:#fafafa;font-size:14px;font-family:inherit;resize:vertical;">${escapeHtml(profile.bio || "")}</textarea>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
              <span id="save-status" style="font-size:13.5px;color:#22c55e;"></span>
              <div style="display:flex;gap:10px;">
                <a href="${routeUrl(profile.username)}" class="btn">Открыть профиль</a>
                <button type="button" class="btn btn-primary" id="save-profile-btn">Сохранить изменения</button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("settings-logout-btn")?.addEventListener("click", logoutUser);

      let newAvatarUrl = profile.avatar_url || "";
      let newBannerUrl = profile.banner_url || "";

      async function uploadMediaFile(file, prefix) {
        const ext = (file.name.split(".").pop() || "png").toLowerCase();
        const path = `${user.id}/${prefix}_${Date.now()}.${ext}`;
        const { error } = await sb.storage.from("media").upload(path, file, { upsert: true });
        if (error) throw error;
        const { data } = sb.storage.from("media").getPublicUrl(path);
        return data.publicUrl;
      }

      document.getElementById("input-avatar")?.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const status = document.getElementById("save-status");
        status.style.color = "#a1a1aa";
        status.textContent = "Загрузка аватарки...";
        try {
          newAvatarUrl = await uploadMediaFile(file, "avatar");
          document.getElementById("preview-avatar").src = newAvatarUrl;
          status.style.color = "#22c55e";
          status.textContent = "Аватарка загружена. Нажмите «Сохранить изменения».";
        } catch (err) {
          status.style.color = "#ef4444";
          status.textContent = "Ошибка загрузки: " + err.message;
        }
      });

      document.getElementById("input-banner")?.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const status = document.getElementById("save-status");
        status.style.color = "#a1a1aa";
        status.textContent = "Загрузка баннера...";
        try {
          newBannerUrl = await uploadMediaFile(file, "banner");
          document.getElementById("preview-banner").style.backgroundImage = `url('${newBannerUrl}')`;
          status.style.color = "#22c55e";
          status.textContent = "Баннер загружен. Нажмите «Сохранить изменения».";
        } catch (err) {
          status.style.color = "#ef4444";
          status.textContent = "Ошибка загрузки: " + err.message;
        }
      });

      document.getElementById("save-profile-btn")?.addEventListener("click", async () => {
        const btn = document.getElementById("save-profile-btn");
        const status = document.getElementById("save-status");
        const bioVal = document.getElementById("input-bio").value.trim();
        btn.disabled = true;
        status.style.color = "#a1a1aa";
        status.textContent = "Сохранение...";

        const { error } = await sb
          .from("profiles")
          .update({
            avatar_url: newAvatarUrl,
            banner_url: newBannerUrl,
            bio: bioVal
          })
          .eq("id", user.id);

        btn.disabled = false;
        if (error) {
          status.style.color = "#ef4444";
          status.textContent = "Ошибка: " + error.message;
        } else {
          status.style.color = "#22c55e";
          status.textContent = "Профиль обновлён!";
        }
      });
    }

    async function renderProfile(username) {
      const app = document.getElementById("app");
      if (!username || !sb) {
        app.classList.add("centered");
        app.innerHTML = `<div class="card"><h1 style="font-size:20px;margin-bottom:8px;">Страница не найдена</h1><a href="${routeUrl("")}" class="btn" style="margin-top:12px;">На главную</a></div>`;
        return;
      }

      const { data: profile } = await sb
        .from("profiles")
        .select("*")
        .eq("username", username)
        .maybeSingle();

      if (!profile) {
        document.title = "Spark MC — Профиль не найден";
        app.classList.add("centered");
        app.innerHTML = `
          <div class="card" style="max-width:420px;width:100%;text-align:center;">
            <h1 style="font-size:20px;font-weight:600;margin-bottom:8px;">Игрок @${escapeHtml(username)} не найден</h1>
            <p style="font-size:14px;color:#8e8e98;margin-bottom:20px;">Возможно, этот пользователь ещё не входил на сайт Spark MC.</p>
            <a href="${routeUrl("")}" class="btn btn-primary">Вернуться на главную</a>
          </div>
        `;
        return;
      }

      document.title = `Spark MC — ${profile.username}`;
      const { data: sessionData } = await sb.auth.getSession();
      const isOwner = sessionData?.session?.user?.id === profile.id;
      const avatar = profile.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
      const bannerStyle = profile.banner_url
        ? `background-image: url('${escapeHtml(profile.banner_url)}');`
        : `background: linear-gradient(135deg, #18181f 0%, #23232e 100%);`;

      app.innerHTML = `
        <div class="card" style="padding: 0; overflow: hidden; max-width: 720px; width: 100%; margin: 0 auto;">
          <div style="width: 100%; height: 190px; background-size: cover; background-position: center; ${bannerStyle}"></div>

          <div style="padding: 0 28px 28px;">
            <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:-44px;margin-bottom:18px;flex-wrap:wrap;gap:12px;">
              <img src="${escapeHtml(avatar)}" alt="${escapeHtml(profile.username)}"
                style="width:88px;height:88px;border-radius:50%;object-fit:cover;border:4px solid #111114;background:#18181b;">

              ${isOwner ? `
                <div style="display:flex;gap:8px;">
                  <a href="${routeUrl("settings")}" class="btn">Редактировать</a>
                  <button type="button" class="btn btn-danger" id="profile-logout-btn">Выйти</button>
                </div>
              ` : ""}
            </div>

            <h1 style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px;">
              ${escapeHtml(profile.username)}
            </h1>

            <p style="font-size: 14.5px; color: ${profile.bio ? "#d4d4d8" : "#71717a"}; line-height: 1.65; white-space: pre-wrap;">
              ${profile.bio ? escapeHtml(profile.bio) : "Пользователь пока не добавил информацию о себе."}
            </p>
          </div>
        </div>
      `;

      if (isOwner) {
        document.getElementById("profile-logout-btn")?.addEventListener("click", logoutUser);
      }
    }
  </script>
</body>
</html>
