<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реклама — @melvkin_</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=4"></script>
  <style>
    .ads-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #070709;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .ads-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
      background: radial-gradient(circle at center, #12121a 0%, #070709 75%);
    }
    .ads-placeholder h2 {
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .ads-placeholder p {
      color: #8b8d98;
      font-size: 16px;
    }
    .ads-image {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
    .ads-float-bar {
      position: fixed;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .ads-float-bar .btn {
      pointer-events: auto;
      background: rgba(14, 14, 19, 0.82);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="ads-float-bar">
      <button class="btn" onclick="goBack()">← Назад на сайт</button>
      <a href="./" data-smooth class="btn">На главную</a>
    </div>

    <div class="ads-fullscreen">
      <!-- Когда загрузите картинку banner.png в репозиторий, замените блок ниже на: <img src="banner.png" class="ads-image" alt="Реклама"> -->
      <div class="ads-placeholder">
        <h2>Место для полноэкранного баннера</h2>
        <p>Загрузите картинку banner.png в репозиторий, чтобы она открылась на весь экран</p>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        navigateSmooth(document.referrer);
      } else {
        navigateSmooth(makeUrl(""));
      }
    }
  </script>
</body>
</html>
