<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Реклама — @melvkin_</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=3"></script>
  <style>
    .ads-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .ads-fullscreen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .ads-back {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(17, 17, 20, 0.78);
    }
    .ads-placeholder {
      text-align: center;
      padding: 24px;
      color: #a1a1aa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <a href="./" class="btn ads-back" onclick="if(document.referrer && document.referrer.includes(location.host)){event.preventDefault();navigateSmooth(document.referrer);}">← Вернуться на сайт</a>

  <div class="ads-fullscreen">
    <div class="ads-placeholder">
      <p style="color:#f4f4f5; font-size:16px; font-weight:500; margin-bottom:6px;">Полноэкранный баннер (/ads)</p>
      <p>Место для вашей картинки на весь экран</p>
    </div>
  </div>
</body>
</html>
