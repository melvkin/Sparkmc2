<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark MC — Главная</title>

  <script src="./config.js?v=8"></script>
</head>
<body>
  <main class="main-wrap centered">
    <div style="max-width: 560px; width: 100%;">
      <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);font-size:12.5px;color:#a1a1aa;margin-bottom:22px;">
        <span style="width:6px;height:6px;border-radius:50%;background:#22c55e;"></span>

      <h1 style="font-size: clamp(32px, 6vw, 48px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.12; margin-bottom: 16px;">
        Создается @melvkin_
      </h1>

      <p style="font-size: 16.5px; color: #8e8e98; line-height: 1.6; margin-bottom: 32px;">

      <div style="display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;">

          Узнать об обновлениях первым →
        </a>
        <a href="./lore.html" id="lore-cta" class="btn" style="padding: 11px 20px; font-size: 14px;">
          Лор и механики
        </a>
      </div>
    </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("upd-cta").href = routeUrl("updates");
      document.getElementById("lore-cta").href = routeUrl("lore.html");
      initLayout("home");
    });
  </script>
</body>
</html>
