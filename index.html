<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@melvkin_ — Главная</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=5"></script>
  <style>
    .hero-wrap {
      max-width: 640px;
      width: 100%;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .status-pill span.dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }
    .hero-title {
      font-size: clamp(36px, 6vw, 58px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.08;
      margin-bottom: 18px;
    }
    .hero-desc {
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero-actions .btn {
      padding: 12px 22px;
      font-size: 14.5px;
      border-radius: 11px;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="content fullscreen-center">
      <div class="hero-wrap">
        <div class="status-pill">
          <span class="dot"></span>
          <span>В разработке • Сезон 1</span>
        </div>
        <h1 class="hero-title">Создается @melvkin_</h1>
        <p class="hero-desc">
          Минималистичный приватный проект с упором на атмосферу, живой лор и продуманные игровые механики без лишнего шума.
        </p>
        <div class="hero-actions" id="hero-cta">
          <a href="lore.html" class="btn btn-primary" data-nav>Изучить лор и механики</a>
          <a href="rules.html" class="btn" data-nav>Правила проекта</a>
        </div>
      </div>
    </main>
  </div>
  <script>
    initLayout('home').then((profile) => {
      if (profile) {
        const cta = document.getElementById('hero-cta');
        const myLink = document.createElement('a');
        myLink.href = appUrl(profile.username);
        myLink.className = 'btn';
        myLink.setAttribute('data-nav', '');
        myLink.textContent = 'Мой профиль';
        cta.appendChild(myLink);
      }
    });
  </script>
</body>
</html>
