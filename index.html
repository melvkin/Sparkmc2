<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark MC — Главная</title>
    <style>html, body { background-color: #09090b !important; color: #fafafa !important; }</style>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="config.js?v=14"></script>
</head>
<body>
    <main class="page-main" style="text-align: center; align-items: center;">
        <h1 id="home-title" style="font-size: 48px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 16px;">Spark MC</h1>
        <p id="home-desc" style="font-size: 18px; color: var(--muted); max-width: 600px; margin-bottom: 32px; line-height: 1.6;">
            В идеях: Лор, Механики и уникальный игровой опыт без лишнего шума.
        </p>
        <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
            <a href="/Sparkmc2/updates" class="btn btn-primary" data-nav>Узнать об обновлениях первым</a>
            <a href="/Sparkmc2/lore" class="btn" data-nav>Лор и механики</a>
        </div>
        <div style="margin-top: 48px; font-size: 14px; color: var(--muted);">
            Создается @melvkin_
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try { await initAuth(); } catch (e) { console.error(e); }
            try { renderLayoutShell(); } catch (e) { console.error(e); }
            document.body.classList.add("page-ready");

            try {
                if (typeof sb !== "undefined" && sb) {
                    const { data } = await sb.from("site_content").select("key, value");
                    if (data) {
                        const content = {};
                        data.forEach(item => { content[item.key] = item.value; });
                        if (content.home_title) {
                            document.getElementById("home-title").textContent = content.home_title;
                            document.title = content.home_title + " — Главная";
                        }
                        if (content.home_desc) document.getElementById("home-desc").textContent = content.home_desc;
                    }
                }
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
